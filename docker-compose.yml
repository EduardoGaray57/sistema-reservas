services:
  postgres:
    image: postgres:16-alpine
    container_name: sistema-reservas-db
    restart: unless-stopped
    ports:
      - "5435:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sistema_reservas
    volumes:
      - sistema-reservas-pgdata:/var/lib/postgresql/data

volumes:
  sistema-reservas-pgdata:
